name: PPU Notice Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 curl_cffi

      - name: Run PPU monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python monitor.py

      - name: Save latest notice
        run: |
          git config user.name "PPU Notice Bot"
          git config user.email "actions@github.com"
          git add last_notice.txt
          git diff --cached --quiet || git commit -m "Update latest PPU notice"
          git push
